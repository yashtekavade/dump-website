{% extends "base.html" %}
{% block content %}
<div class="wrap">
  <a class="back-link" href="/posts/">← all posts</a>
  <h1>{{ page.get("title", title) }}</h1>
  <div class="detail-meta">
    <span>{{ page.get("date_day", "") }}</span>
    {% if page.get("subject") %}<span>{{ page.get("subject") }}</span>{% endif %}
  </div>
  <article class="content">{{ content }}</article>
</div>
{% endblock %}
